# CI — GitHub-hosted checks for this repository.
# The Celestia self-hosted runner fleet is org-scoped and cannot serve this
# personal repo, so everything runs on ubuntu-latest.
#
# Trigger policy (see AGENTS.md §8): PR checks fire on open/reopen/ready only —
# every-push rebuilds waste Actions minutes and PR attention. Re-run manually
# via workflow_dispatch before merging when needed; pushes to master verify the
# merge result.

name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  markdown:
    name: Markdown format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install celestia-devtools
        run: pip install git+https://github.com/celestia-island/celestia-devtools.git

      - name: Check markdown formatting
        run: celestia-devtools format-markdown . --check

  php:
    name: PHP syntax and static tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Dev stack runs frankenphp (PHP 8.3); lint with the same major.minor.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Static test suite (schema consistency + php -l over plugin/)
        run: python3 scripts/test/run.py

  rust:
    name: Rust checks / WASM build / browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Live-stack integration tests are #[ignore]d and skip here; unit tests
      # must pass.
      - name: test
        run: cargo test --workspace --locked

      # Native tests exclude the frontend modules behind cfg(wasm32).
      - name: Build both browser frontends
        run: cargo build --locked --release --target wasm32-unknown-unknown -p _admin -p _game

      - name: Cache wasm-bindgen CLI
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-wasm-bindgen-${{ hashFiles('Cargo.lock') }}

      - name: Generate browser assets with the locked wasm-bindgen version
        run: |
          version=$(python3 -c 'import tomllib; lock = tomllib.load(open("Cargo.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "wasm-bindgen"))')
          cargo install wasm-bindgen-cli --version "$version" --locked
          for app in _admin _game; do
            wasm-bindgen --target web --out-dir plugin/wasm --out-name "$app" "target/wasm32-unknown-unknown/release/$app.wasm"
          done

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json

      - name: Install Chromium and browser test dependencies
        working-directory: scripts/browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      # A local API fixture keeps PR checks independent of Docker/Discuz.
      # The browser runs freshly built WASM; PHP handlers have separate tests.
      - name: Browser regressions on freshly built assets
        run: npm test --prefix scripts/browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-browser-failure
          path: scripts/browser/artifacts/
          if-no-files-found: ignore

  database-contracts:
    name: MariaDB concurrency and PHP/Rust contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TSDM_DB_HOST: 127.0.0.1
      TSDM_DB_USER: root
      TSDM_DB_PASSWORD: test-password
      TSDM_PHP_CGI: php-cgi8.3
      TSDM_API_CONTRACT_FIXTURES: ${{ github.workspace }}/target/api-contract-fixtures.json
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
          tools: none
          coverage: none
      - name: Install PHP CGI
        run: sudo apt-get update && sudo apt-get install -y php8.3-cgi
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-contracts-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Verify complete seeds and upgrade paths
        run: php scripts/test/seed_upgrade_database.php
      - name: Verify Pokemon state transitions against MariaDB
        run: php scripts/test/pokemon_state_database.php
      - name: Verify admin filters and inventory transactions
        run: php scripts/test/admin_filter_database.php && php scripts/test/admin_item_database.php
      - name: Verify admin catalog identities and configuration storage
        run: php scripts/test/admin_catalog_database.php && php scripts/test/admin_identity_database.php
      - name: Verify concurrent configuration defaults and saves
        run: php scripts/test/config_concurrency_database.php
      - name: Verify administrative Pokemon transactions
        run: php scripts/test/admin_pokemon_database.php
      - name: Verify legacy export values against MariaDB
        run: python3 scripts/test/x2_export_regressions.py --database
      - name: Verify forum topic visibility against MariaDB
        run: TSDM_TOPICS_REAL_DB=1 php scripts/test/topics_permissions.php
      - name: Exercise real PHP routes against MariaDB
        run: mkdir -p target && php scripts/test/live_database.php
      - name: Decode generated PHP responses with Rust models
        run: cargo test -p _utils --test php_api_contract --locked -- --ignored
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json
      - name: Install browser integration dependencies
        working-directory: scripts/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Exercise game WASM against PHP and MariaDB
        working-directory: scripts/browser
        run: node live-player.cjs
      - name: Save live browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: game-live-browser-failure
          path: scripts/browser/artifacts/live-player/
          retention-days: 7

  game-browser:
    name: Game and admin browser regressions on shipped bundles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scripts/browser/package-lock.json
      - name: Install browser test dependencies
        working-directory: scripts/browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test the shipped frontend bundles
        working-directory: scripts/browser
        run: npm test
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: game-browser-failure
          path: scripts/browser/artifacts/
          retention-days: 7
