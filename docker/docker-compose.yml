services:
  app:
    image: izumiko/discuz:latest
    container_name: tsdm-app
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
      - "${APP_HTTPS_PORT:-443}:443/udp"
    environment:
      - SERVER_NAME=:80
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - www_data:/app/public
      - ./docker/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - ./plugin:/plugin:ro
      - ./template:/template:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    command: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10
    container_name: tsdm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: discuz
      MARIADB_USER: discuz
      MARIADB_PASSWORD: ${DB_PASSWORD:-discuz}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.d:/docker-entrypoint-initdb.d:ro
      - ./migrations/from-x3:/migrations:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  setup:
    image: mariadb:10
    container_name: tsdm-setup
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./docker/setup.sh:/setup.sh:ro
      - ./docker/init.d/04-tsdm-theme.sql:/theme.sql:ro
      - ./migrations/from-x3:/migrations:ro
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: discuz
      DB_USER: discuz
      DB_PASSWORD: ${DB_PASSWORD:-discuz}
    entrypoint: ["/bin/bash", "/setup.sh"]
    restart: "no"

volumes:
  db_data:
  www_data:
  caddy_data:
  caddy_config:
