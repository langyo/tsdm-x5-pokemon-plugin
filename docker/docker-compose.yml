services:
  app:
    image: izumiko/discuz:latest
    container_name: tsdm-app
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-80}:80"
      - "${APP_HTTPS_PORT:-443}:443"
      - "${APP_HTTPS_PORT:-443}:443/udp"
    environment:
      - SERVER_NAME=:80
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=discuz
      - DB_USER=discuz
      - DB_PASSWORD=${DB_PASSWORD:-discuz}
    volumes:
      # 全部使用目录挂载：podman(WSL) 对 Windows 单文件 bind 支持不可靠
      - www_data:/app/public
      - .:/docker:ro
      - ./config:/etc/caddy:ro
      # Caddyfile 固定引用 /caddy_certs/localhost.*，证书由 entrypoint
      # 生成到该命名卷，避免写回仓库目录；不放在 /etc/caddy 下是因为
      # 只读绑定内无法为嵌套挂载点创建目录
      - caddy_certs:/caddy_certs
      - ../plugin:/plugin:ro
      - ../template:/template:ro
      - caddy_data:/data
      - caddy_config:/config
    entrypoint: ["/bin/bash", "/docker/entrypoint.sh"]
    command: ["frankenphp", "run", "--config", "/etc/caddy/Caddyfile"]
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10
    container_name: tsdm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: discuz
      MARIADB_USER: discuz
      MARIADB_PASSWORD: ${DB_PASSWORD:-discuz}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.d:/docker-entrypoint-initdb.d:ro
      - ../migrations/from-x3:/migrations:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  setup:
    image: mariadb:10
    container_name: tsdm-setup
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - .:/docker:ro
      - ../migrations/from-x3:/migrations:ro
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: discuz
      DB_USER: discuz
      DB_PASSWORD: ${DB_PASSWORD:-discuz}
    entrypoint: ["/bin/bash", "/docker/setup.sh"]
    restart: "no"

volumes:
  db_data:
  www_data:
  caddy_data:
  caddy_config:
  caddy_certs:
