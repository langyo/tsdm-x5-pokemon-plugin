[package]
name = "_admin2"
version = "0.1.0"
edition = "2021"
publish = false
description = "tairitsu rebuild of the admin frontend (slice 1: shell + global config)"

[lib]
crate-type = ["cdylib", "rlib"]

# 依赖与 _game2 完全同源（同 rev 锁定，见 game2/Cargo.toml 的依赖策略注释）。
[dependencies]
tairitsu-vdom = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef", default-features = false }
tairitsu-hooks = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef", default-features = false }
tairitsu-macros = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef", default-features = false }
tairitsu-web = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef", default-features = false, features = [
    "browser",
    "vdom",
    "wit-bindings",
] }
hikari-components = { git = "https://github.com/celestia-island/hikari", rev = "ed699a6b" }
anyhow = "1"
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"

[patch.crates-io]
tairitsu-vdom = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef" }
tairitsu-hooks = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef" }
tairitsu-macros = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef" }
tairitsu-style = { git = "https://github.com/celestia-island/tairitsu", rev = "7f2f6ef" }
