[package]
authors = ["langyo <langyo.china@gmail.com>"]
edition = "2021"
name = "_admin"
publish = false
version = "0.1.10"

build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
_utils = { path = "../utils", version = "*" }

# 禁用 devtools 以避免生成 snippets 调试代码
dioxus = { version = "0.7.2", default-features = false, features = [
  "web",
  "router",
  "launch",
  "lib",
] }

# 明确指定 dioxus-web 依赖，禁用 devtools 功能
dioxus-web = { version = "0.7", default-features = false, features = ["mounted", "document"] }

gloo-timers = { version = "^0.4", features = ["futures"] }

anyhow = "^1"
base64 = "^0.22"
bytes = "^1"
chrono = { version = "^0.4", features = ["serde", "wasmbind"] }
derive_more = { version = "^2", features = [
  "from",
  "into",
  "constructor",
  "display",
] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
strum = "^0.28"
strum_macros = "^0.28"
getrandom = { workspace = true }

console_log = "^1"
console_error_panic_hook = "^0.1"
js-sys = "^0.3"
lazy_static = "*"
log = "^0.4"
reqwest = { version = "^0.12", features = ["json"] }
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "^0.4"

[dependencies.web-sys]
features = [
  "Window",
  "Location",
  "Navigator",
  "Clipboard",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlStyleElement",
  "HtmlTextAreaElement",
  "CssStyleDeclaration",
]
version = "^0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
