[package]
authors = ["langyo <langyo.china@gmail.com>"]
edition = "2021"
name = "_admin"
publish = false
version = "0.1.22"

build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
_utils = { path = "../utils", version = "*" }

# Dioxus 细粒度子 crate。不依赖 dioxus 元 crate：元 crate 会把
# fullstack/server/desktop 的可选依赖（axum、tower、quinn 等）锁入
# Cargo.lock；本项目后端依托论坛 PHP，不设 Rust 服务端。
dioxus-core = "0.7"
dioxus-config-macros = "0.7"
dioxus-core-macro = "0.7"
dioxus-hooks = "0.7"
dioxus-html = "0.7"
dioxus-router = "0.7"
dioxus-signals = "0.7"

# 明确指定 dioxus-web 依赖，禁用 devtools 功能
dioxus-web = { version = "0.7", default-features = false, features = ["mounted", "document"] }

# 图标渲染等处直接调用 eval，需要 document 门面
dioxus-document = "0.7"

gloo-timers = { version = "^0.4", features = ["futures"] }

anyhow = "^1"
base64 = "^0.22"
bytes = "^1"
chrono = { version = "^0.4", features = ["serde", "wasmbind"] }
derive_more = { version = "^2", features = [
  "from",
  "into",
  "constructor",
  "display",
] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
strum = "^0.28"
strum_macros = "^0.28"
getrandom = { workspace = true }

console_log = "^1"
console_error_panic_hook = "^0.1"
js-sys = "^0.3"
lazy_static = "*"
log = "^0.4"
reqwest = { version = "^0.12", features = ["json"] }
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "^0.4"

[dependencies.web-sys]
features = [
  "Window",
  "Location",
  "Navigator",
  "Clipboard",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlStyleElement",
  "HtmlTextAreaElement",
  "CssStyleDeclaration",
]
version = "^0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
