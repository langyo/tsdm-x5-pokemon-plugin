[package]
authors = ["langyo <langyo.china@gmail.com>"]
edition = "2021"
name = "_game"
publish = false
version = "0.1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
_utils = { path = "../utils", version = "*" }

anyhow = "^1"
base64 = "^0.22"
derive_more = { version = "^2", features = [
  "add",
  "add_assign",
  "display",
  "from",
  "into",
] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
strum = "^0.28"
strum_macros = "^0.28"
getrandom = { workspace = true }

console_log = "^1"
console_error_panic_hook = "^0.1"
js-sys = "^0.3"
log = "^0.4"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "^0.4"

# Dioxus (replacing Yew)
# 禁用 devtools 以避免生成 snippets 调试代码
dioxus = { version = "0.7.2", default-features = false, features = [
  "web",
  "router",
  "launch",
  "lib",
] }

# 明确指定 dioxus-web 依赖，禁用 devtools 功能
dioxus-web = { version = "0.7", default-features = false, features = ["mounted", "document"] }

# HTTP requests
gloo-net = "^0.7"
gloo-timers = { version = "^0.4", features = ["futures"] }
reqwest = { version = "^0.12", optional = true }
tokio = { version = "^1", features = ["full"], optional = true }

[dependencies.web-sys]
features = [
  "Window",
  "Location",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlStyleElement",
  "CssStyleDeclaration",
  "Navigator",
  "Clipboard",
  "Storage",
]
version = "^0.3"

# Dioxus 配置 - 禁用 HMR 和路由
[package.metadata.dioxus]
# 禁用 HMR
enable-hmr = false

# E2E测试依赖 (仅用于 examples)
[dev-dependencies]
reqwest = { version = "^0.12", features = ["json", "cookies"] }
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }

# WASM优化配置 - 减小bundle大小
[profile.release]
opt-level = "z"   # 优化大小
lto = true        # 链接时优化
codegen-units = 1 # 更好的优化
panic = "abort"   # 减小panic unwinding代码
strip = true      # 移除符号表

[profile.release.package."*"]
opt-level = 3 # 依赖项使用速度优化

[[example]]
name = "e2e_api_test"
required-features = []
