[package]
authors = ["langyo <langyo.china@gmail.com>"]
edition = "2021"
name = "_game"
publish = false
version = "0.1.20"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
_utils = { path = "../utils", version = "*" }

anyhow = "^1"
base64 = "^0.22"
derive_more = { version = "^2", features = [
  "add",
  "add_assign",
  "display",
  "from",
  "into",
] }
serde = { version = "^1", features = ["derive"] }
serde_json = "^1"
strum = "^0.28"
strum_macros = "^0.28"
getrandom = { workspace = true }

console_log = "^1"
console_error_panic_hook = "^0.1"
js-sys = "^0.3"
log = "^0.4"
wasm-bindgen = "0.2.87"
wasm-bindgen-futures = "^0.4"

# Dioxus 细粒度子 crate。不依赖 dioxus 元 crate：元 crate 会把
# fullstack/server/desktop 的可选依赖（axum、tower、quinn 等）锁入
# Cargo.lock；本项目后端依托论坛 PHP，不设 Rust 服务端。
dioxus-core = "0.7"
dioxus-config-macros = "0.7"
dioxus-core-macro = "0.7"
dioxus-hooks = "0.7"
dioxus-html = "0.7"
dioxus-signals = "0.7"

# 明确指定 dioxus-web 依赖，禁用 devtools 功能
dioxus-web = { version = "0.7", default-features = false, features = ["mounted", "document"] }

# HTTP requests
gloo-net = "^0.7"
gloo-timers = { version = "^0.4", features = ["futures"] }
reqwest = { version = "^0.12", optional = true }
tokio = { version = "^1", features = ["full"], optional = true }

[dependencies.web-sys]
features = [
  "Window",
  "Location",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlHeadElement",
  "HtmlStyleElement",
  "CssStyleDeclaration",
  "Navigator",
  "Clipboard",
  "Storage",
]
version = "^0.3"

# Dioxus 配置 - 禁用 HMR 和路由
[package.metadata.dioxus]
# 禁用 HMR
enable-hmr = false

# E2E测试依赖 (仅用于 examples)
[dev-dependencies]
reqwest = { version = "^0.12", features = ["json", "cookies"] }
tokio = { version = "^1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "e2e_api_test"
required-features = []
