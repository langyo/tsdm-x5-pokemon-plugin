[workspace]
# 显式列举而不写 "rust/*"：通配会把 rust/ 下任何目录当成 workspace 成员，
# 本地工具留下的点目录（如 Mimosa 的 rust/.mimosa/）会让 cargo 直接报
# "failed to load manifest for workspace member" 而整仓不可用。CI 是干净
# checkout 所以永远发现不了，只有本地开发会踩。
members = ["rust/admin", "rust/game", "rust/utils"]
# game2 / admin2 是独立的 wasm32-wasip2 workspace（见下），不并入本仓库的
# cargo 门禁：它们依赖 tairitsu/hikari 整个组件库，编译代价远高于游戏本体，
# 且只能在 wasm32-wasip2 下产出。它们的构建门禁是
# scripts/publish/build_tairitsu_poc.py（研究文档 §10）。
exclude = ["rust/game2", "rust/admin2", "rust/capprobe"]
resolver = "2"

[workspace.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = true

[profile.release.package."*"]
opt-level = 3
